{% extends 'base.html' %}
{% block content %}
<div class="card">
    <div class="card-body">
        <h3>Application Tracking</h3>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Company</th>
                    <th>Position</th>
                    <th>Source</th>
                    <th>Status</th>
                    <th>Notes</th>
                </tr>
            </thead>
            <tbody>
                {% for app in applications %}
                <tr>
                    <td>{{ app.company }}</td>
                    <td>{{ app.position }}</td>
                    <td>{{ app.source }}</td>
                    <td>{{ app.status }}</td>
                    <td>{{ app.notes }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
